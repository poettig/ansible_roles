---

- name: "Load OS dependent variables"
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['distribution'] | lower }}.yml"
  failed_when: false  # never fail, even if the file does not exist

- name: "Install zsh and programs it uses"
  ansible.builtin.package:
    name: "{{ zsh_package_names }}"

- name: "Create symlink from fd to fdfind if on Debian"
  ansible.builtin.file:
    src: "/usr/bin/fdfind"
    dest: "/usr/local/bin/fd"
    state: link
  ignore_errors: "{{ ansible_check_mode }}"
  when: ansible_facts["distribution"] == "Debian"

- name: "Configure zsh for each requested user"
  ansible.builtin.include_tasks: for_each_user.yml
  loop: "{{ lookup('community.general.merge_variables', 'zsh_users', pattern_type='prefix') }}"
