---

- name: "Enable required locales"
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop:
    - "de_DE.UTF-8"
    - "en_US.UTF-8"
    - "en_GB.UTF-8"
    - "en_DK.UTF-8"

- name: "Setup locale"
  ansible.builtin.copy:
    content: |
      LANG=en_US.UTF-8
      LC_ADDRESS=de_DE.UTF-8
      LC_IDENTIFICATION=de_DE.UTF-8
      LC_MEASUREMENT=de_DE.UTF-8
      LC_MONETARY=de_DE.UTF-8
      LC_NAME=de_DE.UTF-8
      LC_NUMERIC=de_DE.UTF-8
      LC_PAPER=de_DE.UTF-8
      LC_TELEPHONE=de_DE.UTF-8
      LC_TIME=en_DK.UTF-8
    dest: "/etc/default/locale"
    mode: "0644"

- name: "Set timezone"
  community.general.timezone:
    name: "Europe/Berlin"

- name: "Set /etc/mailname"
  ansible.builtin.copy:
    content: "{{ inventory_hostname }}"
    dest: "/etc/mailname"
    mode: "0644"

- name: "Set hostname in /etc/hostname"
  ansible.builtin.copy:
    content: "{{ inventory_hostname.partition('.')[0] }}"
    dest: "/etc/hostname"
    mode: "0644"

- name: "Set hostname immediately"
  ansible.builtin.hostname:
    name: "{{ inventory_hostname.partition('.')[0] }}"

- name: "Set /etc/hosts"
  ansible.builtin.copy:
    content: |
      127.0.0.1 {{ inventory_hostname }}{% if "." in inventory_hostname %} {{ inventory_hostname.split(".")[0:-2] | join(".") }}{% endif %} localhost
      ::1       {{ inventory_hostname }}{% if "." in inventory_hostname %} {{ inventory_hostname.split(".")[0:-2] | join(".") }}{% endif %} localhost ip6-localhost ip6-loopback
      ff02::1   ip6-allnodes
      ff02::2   ip6-allrouters
    dest: "/etc/hosts"
    mode: "0644"

- name: "Deploy motd"
  ansible.builtin.template:
    src: "motd.j2"
    dest: "/etc/motd"
    mode: "0644"

- name: "Add client settings if enabled"
  ansible.builtin.include_tasks: client.yml
  when: system_settings_is_client
