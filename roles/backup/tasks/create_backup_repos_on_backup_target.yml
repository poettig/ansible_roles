---

- name: "Create user for backup repos"
  ansible.builtin.user:
    name: "backup"
    home: "{{ backup_repos_homedir }}"
    skeleton: "/etc/skel"
    shell: "/usr/bin/bash"
  register: backup_user_info

- name: "Install borg for backup user"
  ansible.builtin.include_tasks: install_borg.yml
  vars:
    backup_borg_install_user: "{{ backup_user_info.name }}"

- name: "Create authorized_keys entries allowing full access to backups"
  ansible.builtin.copy:
    content: |
      # Ansible Managed file
      {% for key in backup_full_access_keys_from | map("extract", ssh_keys) | flatten %}
      {{ key }}
      {% endfor %}
    dest: "{{ backup_user_info.home }}/.ssh/authorized_keys"
    owner: "{{ backup_user_info.uid }}"
    group: "{{ backup_user_info.group }}"
    mode: "0600"

- name: "Set up ssh server to also ready authorized_keys_append_only"
  ansible.builtin.copy:
    content:
      AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys_append_only
    dest: "/etc/ssh/sshd_config.d/authorized_keys_append_only_for_borg.conf"
    mode: "0644"
  notify: "Restart sshd"

- name: "Create repo for each backup client"
  ansible.builtin.include_tasks: create_backup_repo_on_backup_target.yml
  loop: "{{ backup_client_hosts }}"
